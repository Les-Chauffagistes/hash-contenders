services:
  app:
    image: hash-contenders-front:${TAG:-latest}
    restart: unless-stopped
    ports:
      - "${PORT:-3003}:3003"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3003/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
