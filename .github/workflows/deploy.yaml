name: Build & Deploy

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: hash-contenders

jobs:
  lint:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4

      - run: npm ci --prefer-offline

      - run: npm run lint

  build:
    runs-on: [self-hosted, macOS]
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }} \
            --build-arg NEXT_PUBLIC_WSS_URL=${{ vars.NEXT_PUBLIC_WSS_URL }} \
            -t $IMAGE_NAME:sha-$SHORT_SHA \
            -t $IMAGE_NAME:latest \
            .

      - name: Notify deploy
        run: |
          curl -X POST ${{ secrets.GLOBAL_DEPLOY_URL }} \
            -H "X-Deploy-Token: ${{ secrets.GLOBAL_DEPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"repository": {"full_name": "Les-Chauffagistes/hash-contenders"}}'
